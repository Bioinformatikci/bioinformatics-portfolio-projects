<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 445" role="img" aria-labelledby="title desc"><title id="title">Synthetic expression zeroing audit</title><desc id="desc">Three splicing and two additional pathogenicity targets per AD sample.</desc><rect width="780" height="445" fill="#ffffff"/><style>text{font-family:system-ui,Arial,sans-serif;fill:#18332f}</style><text x="34" y="42" font-size="23" font-weight="700">Allowed expression zeroing</text><text x="34" y="67" font-size="13">Only synthetic AD targets were changed; controls were unchanged</text><text x="34" y="129" font-size="14">DEMO_AD_01</text><rect x="180" y="112" width="210" height="25" rx="4" fill="#467d87"/><rect x="390" y="112" width="140" height="25" rx="4" fill="#c26d55"/><text x="545" y="130" font-size="13">3 splicing + 2 additional</text><text x="34" y="198" font-size="14">DEMO_AD_02</text><rect x="180" y="181" width="210" height="25" rx="4" fill="#467d87"/><rect x="390" y="181" width="140" height="25" rx="4" fill="#c26d55"/><text x="545" y="199" font-size="13">3 splicing + 2 additional</text><text x="34" y="267" font-size="14">DEMO_AD_03</text><rect x="180" y="250" width="210" height="25" rx="4" fill="#467d87"/><rect x="390" y="250" width="140" height="25" rx="4" fill="#c26d55"/><text x="545" y="268" font-size="13">3 splicing + 2 additional</text><text x="34" y="336" font-size="14">DEMO_AD_04</text><rect x="180" y="319" width="210" height="25" rx="4" fill="#467d87"/><rect x="390" y="319" width="140" height="25" rx="4" fill="#c26d55"/><text x="545" y="337" font-size="13">3 splicing + 2 additional</text><rect x="34" y="405" width="14" height="14" fill="#467d87"/><text x="56" y="417" font-size="13">Splicing targets</text><rect x="200" y="405" width="14" height="14" fill="#c26d55"/><text x="222" y="417" font-size="13">Additional pathogenicity targets</text></svg>
