name: Verify synthetic splicing demo

on:
  push:
    paths:
      - "splicing-pathogenicity-imat-demo/**"
      - ".github/workflows/verify-splicing-demo.yml"
  pull_request:
    paths:
      - "splicing-pathogenicity-imat-demo/**"
      - ".github/workflows/verify-splicing-demo.yml"

jobs:
  published-results:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splicing-pathogenicity-imat-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check script syntax
        run: python -m compileall -q .
      - name: Verify synthetic inputs and published Gurobi results
        run: python -m unittest discover -s tests -v
